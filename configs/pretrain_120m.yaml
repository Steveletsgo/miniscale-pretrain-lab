model:
  vocab_size: 32000
  num_layers: 12
  hidden_size: 768
  num_attention_heads: 12
  num_kv_heads: 4
  intermediate_size: 2688
  max_sequence_length: 1024
  rope_base: 10000.0
  dropout: 0.0
  tie_embeddings: true

data:
  train_path: data/processed/train.bin
  validation_path: data/processed/validation.bin
  dtype: uint32
  synthetic_train_samples: 0
  synthetic_validation_samples: 0
  num_workers: 4

train:
  seed: 1337
  strategy: ddp
  precision: bf16
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 4000
  eval_interval: 200
  eval_batches: 20
  checkpoint_interval: 500
  log_interval: 10
  learning_rate: 0.0006
  min_learning_rate: 0.00006
  warmup_steps: 200
  weight_decay: 0.1
  max_grad_norm: 1.0

output:
  run_dir: runs/pretrain_120m
  resume_from: null

