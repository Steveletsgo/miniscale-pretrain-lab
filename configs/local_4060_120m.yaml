model:
  vocab_size: 32000
  num_layers: 12
  hidden_size: 768
  num_attention_heads: 12
  num_kv_heads: 4
  intermediate_size: 2688
  max_sequence_length: 256
  rope_base: 10000.0
  dropout: 0.0
  tie_embeddings: true

data:
  train_path: null
  validation_path: null
  dtype: uint32
  synthetic_train_samples: 2048
  synthetic_validation_samples: 128
  num_workers: 0

train:
  seed: 1337
  strategy: single
  precision: bf16
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  max_steps: 20
  eval_interval: 10
  eval_batches: 4
  # The final checkpoint is sufficient for the local baseline and saves about
  # 2.7 GiB compared with also retaining step-10 and step-20 snapshots.
  checkpoint_interval: 100
  log_interval: 1
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 2
  weight_decay: 0.1
  max_grad_norm: 1.0

output:
  run_dir: runs/local_4060_120m
  resume_from: null
