model:
  vocab_size: 512
  num_layers: 2
  hidden_size: 128
  num_attention_heads: 4
  num_kv_heads: 2
  intermediate_size: 256
  max_sequence_length: 64
  rope_base: 10000.0
  dropout: 0.0
  tie_embeddings: true

data:
  train_path: null
  validation_path: null
  dtype: uint32
  synthetic_train_samples: 128
  synthetic_validation_samples: 32
  num_workers: 0

train:
  seed: 1337
  strategy: single
  precision: fp32
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  max_steps: 5
  eval_interval: 2
  eval_batches: 2
  checkpoint_interval: 3
  log_interval: 1
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_steps: 1
  weight_decay: 0.1
  max_grad_norm: 1.0

output:
  run_dir: runs/smoke_cpu
  resume_from: null

