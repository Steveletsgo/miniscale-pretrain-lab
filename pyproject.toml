[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniscale-pretrain-lab"
version = "0.1.0"
description = "A reproducible small-scale distributed pretraining laboratory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.3",
  "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
data = ["datasets>=2.20", "huggingface-hub>=0.24"]
train = ["tensorboard>=2.17", "transformers>=4.44", "deepspeed>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

